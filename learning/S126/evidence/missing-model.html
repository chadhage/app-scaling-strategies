<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S126 - Missing local model fixture</title>
  <link rel="stylesheet" href="../lesson.css">
  <script src="absent-model.js" defer></script>
  <script src="../app.js" defer></script>
</head>
<body>
  <main>
    <p class="banner">Training rehearsal - synthetic data - not a live Azure result</p>
    <h1>Deliberate missing-model safety fixture</h1>
    <p>This test-only page lacks a local model. No revision or retirement action can run.</p>
    <form id="plan-form">
      <label for="fixture">Fixed observation fixture</label><select id="fixture"><option>healthy</option></select>
      <label for="token">Candidate software token (exactly v2)</label><input id="token" value="v2">
      <button id="prepare-button" type="submit">Record candidate DATA</button>
    </form>
    <button id="reset-button" type="button">Reset this in-memory rehearsal</button>
    <p>Phase: <output id="phase">baseline</output></p>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" aria-live="assertive" tabindex="-1"></p>
  </main>
</body>
</html>
