<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S133 controlled missing-model fixture</title>
  <link rel="stylesheet" href="..\lesson.css">
  <script src="absent-model.js" defer></script>
  <script src="..\app.js" defer></script>
</head>
<body>
  <main>
    <p class="banner">Training rehearsal - synthetic data - not a live Azure result</p>
    <h1>Test-only missing local model DATA</h1>
    <form id="controls">
      <button id="start-button" type="submit">Start old form</button>
      <button id="cutover-button" type="button">Cut over between steps</button>
      <button id="continue-button" type="button">Continue final step</button>
      <button id="submit-button" type="button">Submit final form</button>
      <button id="retry-button" type="button">Retry same submission</button>
      <button id="measure-button" type="button">Measure original journey</button>
      <button id="reset-button" type="button">Reset controls / retain history</button>
    </form>
    <p>Phase: <output id="phase">idle</output></p>
    <p id="run-summary">No measured result.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert"></p>
  </main>
</body>
</html>
