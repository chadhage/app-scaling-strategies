<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <title>S132 controlled missing-model failure</title>
  <link rel="stylesheet" href="../lesson.css">
  <script src="../app.js" defer></script>
</head>
<body>
  <p class="banner">Training rehearsal - synthetic data - not a live Azure result</p>
  <h1>Test-only missing local model</h1>
  <form id="controls">
    <label for="preset">Fixed fictional sign-in trace</label><select id="preset"><option>compatible</option></select>
    <label for="budget">Agreed original journey budget</label><input id="budget" value="2000">
    <button id="start-button" type="submit">Start</button>
  </form>
  <button id="cutover-button" type="button">Cut over</button>
  <button id="callback-button" type="button">Callback</button>
  <button id="finish-button" type="button">Finish</button>
  <button id="reset-button" type="button">Reset</button>
  <p id="error" role="alert"></p><p id="status" role="status"></p>
  <p id="phase">idle</p>
  <p id="result">No measured original sign-in result.</p>
</body>
</html>
